# Dependabot version updates: one entry per ecosystem and folder that has a manifest.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # The npm workspace (desktop app, protocol package) and its single lockfile at the root.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  # The relay is a separate package with its own lockfile.
  - package-ecosystem: "npm"
    directory: "/relay"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  # The Rust engine workspace (cryptography crates included).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      rust-minor-and-patch:
        update-types: ["minor", "patch"]

  # The Tauri shell has its own Cargo.lock outside the workspace.
  - package-ecosystem: "cargo"
    directory: "/apps/desktop/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "gradle"
    directory: "/apps/android"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    # These need a newer Android Gradle Plugin (8.12+ / 9), which the screenshot-test plugin (Paparazzi 1.3.5) cannot run
    # on yet. Update them together with that migration, not one by one.
    ignore:
      - dependency-name: "com.google.devtools.ksp"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "androidx.fragment:fragment-ktx"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
