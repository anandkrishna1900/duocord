name: Test builds

# Builds UNSIGNED installers you can try (Actions run > Artifacts). Every merge to main (except site/ and root .md
# changes) also replaces the files on the Android and Windows releases, which the website links to. A manual run
# publishes only if "publish" is ticked. Not a signed release: see docs/DEPLOYMENT.md.
on:
  push:
    branches: [main]
    paths-ignore: ['site/**', '*.md']
  workflow_dispatch:
    inputs:
      publish:
        description: Also replace the files on the Android and Windows releases (the site links to them)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: test-builds
  cancel-in-progress: false

jobs:
  windows:
    name: Windows installer (unsigned)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run tauri:build
      - uses: actions/upload-artifact@v7
        with:
          name: duochat-windows-unsigned
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Relay dependencies
        working-directory: relay
        run: npm ci
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager --licenses > /dev/null || true
      # The Rust core, built for the two phone CPU types and packed into the APK (apps/android/app/src/main/jniLibs).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build the Rust core for Android
        # The runner sets ANDROID_NDK_ROOT (not ANDROID_NDK_LATEST_HOME on this image).
        # Optimised for size on phones (messages and files are small; the APK download is not).
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: s
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          cargo ndk -t arm64-v8a -t armeabi-v7a \
            -o apps/android/app/src/main/jniLibs build -p privcord-ffi --release --locked
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        working-directory: apps/android
        run: ./gradlew :app:assembleRelease -Pduochat.ciSign=true --console=plain
      - name: Each APK contains the Rust core for its CPU type
        run: |
          for abi in arm64-v8a armeabi-v7a; do
            unzip -l apps/android/app/build/outputs/apk/release/app-$abi-release.apk | grep "lib/$abi/libprivcord_ffi.so"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: duochat-android
          path: apps/android/app/build/outputs/apk/release/*.apk

  publish:
    name: Replace the release files
    if: github.event_name == 'push' || inputs.publish
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: out
      - name: Upload (the site links to these exact names)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp out/duochat-android/app-arm64-v8a-release.apk PrivCord.apk
          gh release upload Android PrivCord.apk --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload Windows out/duochat-windows-unsigned/*.exe --clobber --repo "$GITHUB_REPOSITORY"
