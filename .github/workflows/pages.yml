name: Landing page

# Publishes site/ to GitHub Pages. One-time setup: Settings > Pages > Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: Fill in the site address and repository
        run: |
          base="${{ steps.pages.outputs.base_url }}"
          for f in site/index.html site/robots.txt site/sitemap.xml; do
            sed -i "s#__SITE_URL__#${base}#g; s#__REPO__#${{ github.repository }}#g" "$f"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
